[project]
name = "arithmetic-service"
version = "0.1.0"
description = "FastAPI Arithmetic Service with Pytest, Evidently, and Jenkins integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "evidently>=0.4.0",
    "pandas>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arithmetic_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
